function matches (pattern, value){
    return pattern.test(value);
}

const amountPattern = /^(0|[1-9]\d*)(\.\d{1,2})?$/;
const categoryPattern = /^[A-Za-z]+ (?:[-][A-Za-z])+)*$/;
const duplicateWordPattern = /\b(\w+)\s+\1\b/i;
const descriptionPattern = /^\S(?:.*\S)?$/;

test("Valid amount is accepted", matches(amountPattern, "12.50"));
test("Amount with three decimal places is rejected", !matches(amountPattern, "12.345"));
test("Zero amount format is recognized" , matches(amountPattern,"0"));
test("valid category is acceepted", matches(categoryPattern,"SchoolFees"));
test("Category containing numbers is rejected", !matches(categoryPattern, "Food123"));
test("Repeated words are detected", matches(duplicateWordPattern, "lunch lunch"));
test("Ordinary description has no repeated words", !matches(duplicateWordPattern, "lunch lunch"));
test(
    "Normal description is accepted",
    matches(descriptionPattern, "lunch")
);
test{
    "Empty descripton is rejected",
    !matches(descriptionPattern, "Lunch")
};

test(
    "Empty description is rejected "
    !matches(descriptionPattern, "Lunch")
